[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "how-cli-assist"
version = "2.0.0"
description = "Terminal assistant generating accurate shell commands, powered by any OpenAI-compatible API provider"
authors = [{ name = "Adem Kouki" }]
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "requests",
    "questionary",
    "pyperclip",
    "psutil"
]
requires-python = ">=3.8"

[project.scripts]
how = "how.main:main"
